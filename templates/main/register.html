{% extends 'base.html' %}
{% block title %}Register - Zuhraan{% endblock %}
{% block extra_css %}
<style>
    .register-card { max-width: 560px; margin: 20px auto 120px; padding: 36px 44px 44px; background: #fff; border-radius: 32px; box-shadow: 0 25px 80px rgba(0,0,0,0.06); text-align: left; font-family: sans-serif; }
    .register-field { margin-bottom: 24px; position: relative; }
    .register-label { display: block; margin-bottom: 12px; color: var(--dark); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; font-family: sans-serif; }
    .register-input { width: 100%; box-sizing: border-box; padding: 18px; border: 1px solid #ddd; border-radius: 12px; color: var(--dark); font: 1rem sans-serif; outline: none; }
    .register-input-with-toggle { padding-right: 50px; }
    .password-toggle { position: absolute; right: 16px; top: calc(100% - 46px); background: none; border: none; cursor: pointer; padding: 4px; color: var(--muted); display: flex; align-items: center; justify-content: center; line-height: 1; }
    .password-toggle:hover { color: var(--dark); }
    .password-toggle:focus { outline: none; color: var(--dark); }
    .password-toggle svg { width: 20px; height: 20px; stroke-width: 2; }
    .register-button { width: 100%; padding: 19px; border: 0; border-radius: 40px; background: var(--dark); color: #fff; font-size: 1rem; font-family: sans-serif; cursor: pointer; }
    .register-note { margin: 25px 0 0; color: var(--muted); font-size: 0.9rem; text-align: center; font-family: sans-serif; }
    @media (max-width: 600px) { .register-card { margin: 40px 20px 100px; padding: 32px 24px 38px; } }
</style>
{% endblock %}

{% block content %}
<section class="register-card">
    <div style="text-align: center; margin-bottom: 32px;">
        <h1 style="font-family: sans-serif; font-size: 3.2rem; margin: 0 0 8px;">Create Your Account</h1>
        <p style="color: var(--muted); margin: 0; font-family: sans-serif;">Create an account to get started.</p>
    </div>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="register-field">
            <label class="register-label">Full Name</label>
            <input class="register-input" type="text" name="name" placeholder="Enter your full name" required>
        </div>

        <div class="register-field">
            <label class="register-label">Email Address</label>
            <input class="register-input" type="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="register-field">
            <label class="register-label">Password</label>
            <input class="register-input register-input-with-toggle" type="password" name="password" id="password" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePassword('password', this)">
                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            </button>
        </div>

        <div class="register-field">
            <label class="register-label">Confirm Password</label>
            <input class="register-input register-input-with-toggle" type="password" name="confirm_password" id="confirm_password" placeholder="Confirm your password" required>
            <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePassword('confirm_password', this)">
                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            </button>
        </div>

        <button class="register-button" type="submit">Create Account</button>
    </form>

    <p class="register-note">Already have an account? <a href="{{ url_for('main.login') }}" style="color: var(--dark); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--amber); font-family: sans-serif;">Sign In</a></p>
</section>
<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const eyeIcon = button.querySelector('.eye-icon');
        const eyeOffIcon = button.querySelector('.eye-off-icon');

        if (input.type === 'password') {
            input.type = 'text';
            eyeIcon.style.display = 'none';
            eyeOffIcon.style.display = 'block';
            button.setAttribute('aria-label', 'Hide password');
        } else {
            input.type = 'password';
            eyeIcon.style.display = 'block';
            eyeOffIcon.style.display = 'none';
            button.setAttribute('aria-label', 'Show password');
        }
    }
</script>
{% endblock %}
